name: Build OpenWrt for XiaoMi AX3600

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      manual_config:
        description: '需要进入 tmate SSH 手动 menuconfig 吗？'
        required: false
        default: 'n'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file wget python3

      - name: Clone OpenWrt source
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: SSH 远程调试（tmate）进入 cd source && make menuconfig
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_config == 'y' }}
        uses: mxschmitt/action-tmate@v3

      - name: Find and copy first .config (if any)
        run: |
          find . -name .config -print -exec cp {} ./found.config \; -quit
          ls -l found.config || echo "No .config found"

      - name: Upload .config from all possible locations
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: |
            found.config
            source/.config
            .config

      #- name: Generate configuration file
      #  run: make defconfig

      - name: Generate configuration file
        run: |
          rm -f ./.config*
          touch ./.config

          #
          # 在 cat >> .config <<EOF 到 EOF 之间粘贴你的编译配置, 需注意缩进关系
          # 例如:

          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_PROFILE="DEVICE_xiaomi_ax3600"
          EOF

          #
          # ===============================================================
          # 

          sed -i 's/^[ \t]*//g' ./.config
          make defconfig
          
      #- name: Copy custom config
        #run: |
          #cp $GITHUB_WORKSPACE/configs/xiaomi_ax3600.config openwrt/.config

      - name: Download package sources
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

          - name: Upload artifacts
          uses: actions/upload-artifact@v4
          with:
            name: ipq807x-images
            path: bin/targets/qualcommax/ipq807x
  
  release:
      name: Create release
      needs: [build]
      if: needs.build.result == 'success'
      runs-on: ubuntu-24.04
      steps:
        - name: Download artifacts
          uses: actions/download-artifact@v4
          with:
            name: ipq807x-images
            path: firmware
        - name: Set release date
          run: echo "RELEASE_DATE=$(date +%F)" >> $GITHUB_ENV
        - name: Publish release
          uses: softprops/action-gh-release@master
          with:
            files: firmware/*
            tag_name: ${{ env.RELEASE_PREFIX }}-${{ env.RELEASE_DATE }}
            name: 🚀 OpenWrt Build Release ${{ env.RELEASE_DATE }}
            body: |
              ## 📦 OpenWrt Automated Build Release
  
              **Build Date:** ${{ env.RELEASE_DATE }}
  
              ### 🔄 Main Repository
              **Repository:** [${{ env.REMOTE_REPOSITORY }}](https://github.com/${{ env.REMOTE_REPOSITORY }})
              **Branch:** `${{ env.REMOTE_BRANCH }}`
              **Commit:** `${{ needs.check_commits.outputs.latest_commit_sha }}`
  
              ### 📦 NSS Packages
              **Repository:** [${{ env.NSS_PACKAGES_REPOSITORY }}](https://github.com/${{ env.NSS_PACKAGES_REPOSITORY }})
              **Branch:** `${{ env.NSS_PACKAGES_REPOSITORY_BRANCH }}`
              **Commit:** `${{ needs.check_commits.outputs.nss_packages_repo_latest_commit_sha }}`
  
              ### 📝 Build Information
              - **Target:** [Xiaomi Mi AIoT Router AX3600](https://openwrt.org/toh/xiaomi/ax3600)
              - **Configuration:** [`${{ env.CONFIG_FILE }}`](${{ env.CONFIG_FILE }})
  
              ### 📋 Notes
              - Automated build triggered by ${{ github.event_name }}
              - Previous releases are automatically cleaned up (keeping latest 2)
              ---
              _Generated by GitHub Actions 🤖_
  
        - name: Clean up old releases
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            gh api repos/${{ github.repository }}/releases --paginate --jq '.[2:] | .[] | "\(.id) \(.tag_name)"' | while read id tag; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
            done
